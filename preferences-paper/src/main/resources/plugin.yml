name: Preferences
version: '${version}'
main: dev.mintychochip.preferences.paper.PreferencesPlugin
api-version: '26.2'
description: Typed preferences with dialog GUI, owned by this plugin.
commands:
  preferences:
    description: Open your preferences dialog.
    usage: /preferences [global]
    aliases: [prefs]
    permission: preferences.use
permissions:
  preferences.use:
    description: Open and edit your own preferences.
    default: true
  preferences.manage:
    description: View and edit server-global preferences.
    default: op
