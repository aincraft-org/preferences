name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build and test (incl. :preferences-test module)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Multi-module build + unit tests
        # Root aggregator has no `test` task; `:ci` builds all modules (incl. :preferences-test) and runs subproject tests.
        run: ./gradlew --no-daemon --stacktrace ci

      - name: Prove Maven publish path (local + consumer resolve)
        run: ./scripts/verify-maven-publish.sh
