name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build and test (incl. :test module)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Multi-module build + unit tests + :test package
        # Explicit :test:build makes the test plugin a hard CI requirement.
        # Unit tests run via root `test` (api + common). No runServer (non-deterministic).
        run: ./gradlew --no-daemon --stacktrace :api:build :common:build :paper:build :test:build test

      - name: Prove Maven publish path (local + consumer resolve)
        run: ./scripts/verify-maven-publish.sh
